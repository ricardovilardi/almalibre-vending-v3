<!doctype html>
<!-- Almalibre logo printed on the cup, positioned for the frame at 16 s (cup band y≈1220–1440).
     Rendered to build/video/cup-logo.png (1080x1920, transparent); scripts/overlay_sequence.swift moves it with the cup.
     Add ?bg to preview it over the 16 s frame (build/video/f16.jpg). -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#bg{position:absolute;left:0;top:0;width:1080px;display:none}
.logo{position:absolute;left:625px;top:1272px;width:300px;opacity:.93;filter:blur(.5px);
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.55),#000 22%,#000 78%,rgba(0,0,0,.55))}
</style></head><body>
<img id="bg" src="../../build/video/f16.jpg">
<img class="logo" src="../img/logo-white.png">
<script>if(location.search.includes('bg'))document.getElementById('bg').style.display='block'</script>
</body></html>
